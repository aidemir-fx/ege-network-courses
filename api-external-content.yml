openapi: 3.1.1
info:
  title: External Content API
  description: API for reading course catalogs and playing course module materials from external systems
  version: 1.0.0
servers:
  - url: http://localhost:8080/api

paths:
  /external/courses:
    get:
      summary: List all courses available to the external integration
      operationId: listExternalCourses
      security:
        - ApiKeyAuth: [ ]
      responses:
        '200':
          description: All courses with modules and content ordered for display
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalCourseResponse'
        '401':
          description: API key is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalContentDefaultError'

  /external/courses/{courseId}/modules/{moduleId}/materials:
    get:
      summary: Get playback and download links for course module materials
      operationId: getExternalCourseModuleMaterials
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
          description: Course identifier
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
          description: Module identifier mapped to a lesson identifier in admin-back
      responses:
        '200':
          description: Playback and presigned download links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCourseModuleMaterialsResponse'
        '400':
          description: Invalid path identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalContentDefaultError'
        '401':
          description: API key is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalContentDefaultError'
        '404':
          description: Course module not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalContentDefaultError'

  /external/videos/{id}/playback:
    get:
      summary: Get an API-key authenticated HLS object for a READY video
      operationId: getExternalVideoPlaybackObject
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
          description: Unique identifier of the video
        - name: path
          in: query
          required: false
          schema:
            type: string
            default: master.m3u8
          description: HLS object path relative to the video HLS directory
      responses:
        '200':
          description: HLS playlist or segment
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
            video/mp2t:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Video is not ready for playback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalContentDefaultError'
        '401':
          description: API key is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalContentDefaultError'
        '404':
          description: Video or playback object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalContentDefaultError'

components:
  schemas:
    ExternalCourseResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Course identifier
        title:
          type: string
          description: Course title
        annotation:
          type: string
          description: Short plain-text course annotation
          nullable: true
        description:
          type: string
          description: Full course description
          nullable: true
        status:
          $ref: '#/components/schemas/ExternalCourseStatus'
        cover_file_id:
          type: integer
          format: int32
          description: Course cover file identifier
          nullable: true
        modules:
          type: array
          description: Course modules with their content in display order
          items:
            $ref: '#/components/schemas/ExternalCourseModuleResponse'
      required:
        - id
        - title
        - status
        - modules

    ExternalCourseModuleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Module identifier mapped to a lesson identifier in admin-back
        course_id:
          type: integer
          format: int32
          description: Parent course identifier
        title:
          type: string
          description: Module title
        annotation:
          type: string
          description: Short plain-text module annotation
          nullable: true
        description:
          type: string
          description: Full module description
          nullable: true
        cover_file_id:
          type: integer
          format: int32
          description: Module cover file identifier
          nullable: true
        position:
          type: integer
          format: int32
          description: Module display position inside the course
        contents:
          type: array
          description: Module content items in display order
          items:
            $ref: '#/components/schemas/ExternalModuleContentResponse'
      required:
        - id
        - course_id
        - title
        - position
        - contents

    ExternalModuleContentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Content item identifier
        module_id:
          type: integer
          format: int32
          description: Parent module identifier
        position:
          type: integer
          format: int32
          description: Content item display position inside the module
        content_type:
          $ref: '#/components/schemas/ExternalModuleContentType'
        video:
          $ref: '#/components/schemas/ExternalVideoResponse'
          nullable: true
        file:
          $ref: '#/components/schemas/ExternalFileResponse'
          nullable: true
        file_type:
          $ref: '#/components/schemas/ExternalLessonFileType'
          description: Purpose of the attached file; null for video content
          nullable: true
      required:
        - id
        - module_id
        - position
        - content_type

    ExternalVideoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Video identifier
        title:
          type: string
          description: Video title
        description:
          type: string
          description: Legacy video description
          nullable: true
        size_bytes:
          type: integer
          format: int64
          description: Source file size in bytes
        mime_type:
          type: string
          description: Source MIME type
        duration_seconds:
          type: number
          description: Video duration in seconds
          nullable: true
        status:
          $ref: '#/components/schemas/ExternalVideoStatus'
      required:
        - id
        - title
        - size_bytes
        - mime_type
        - status

    ExternalFileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: File identifier
        original_filename:
          type: string
          description: Original uploaded filename
        extension:
          type: string
          description: Normalized extension without a dot
        size_bytes:
          type: integer
          format: int64
          description: File size in bytes
        mime_type:
          type: string
          description: File MIME type
        status:
          $ref: '#/components/schemas/ExternalFileStatus'
      required:
        - id
        - original_filename
        - extension
        - size_bytes
        - mime_type
        - status

    ExternalCourseStatus:
      type: string
      description: Course lifecycle state
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED

    ExternalModuleContentType:
      type: string
      description: Module content item type
      enum:
        - VIDEO
        - FILE

    ExternalVideoStatus:
      type: string
      description: Video lifecycle state
      enum:
        - UPLOADING
        - UPLOADED
        - TRANSCODING
        - READY
        - FAILED

    ExternalFileStatus:
      type: string
      description: File lifecycle state
      enum:
        - UPLOADING
        - READY
        - FAILED

    ExternalCourseModuleMaterialsResponse:
      type: object
      properties:
        course_id:
          type: integer
          format: int32
          description: Course identifier
        module_id:
          type: integer
          format: int32
          description: Module identifier
        videos:
          type: array
          description: API-key authenticated backend playback URLs of READY videos
          items:
            type: string
            format: uri
        files:
          type: array
          description: Ready files with their purpose and presigned direct S3 URL
          items:
            $ref: '#/components/schemas/ExternalCourseModuleFileResponse'
      required:
        - course_id
        - module_id
        - videos
        - files

    ExternalCourseModuleFileResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Presigned direct S3 URL of the ready file
        file_type:
          $ref: '#/components/schemas/ExternalLessonFileType'
      required:
        - url
        - file_type

    ExternalLessonFileType:
      type: string
      description: Purpose of a file inside the lesson
      enum:
        - MATERIAL
        - HOMEWORK

    ExternalContentDefaultError:
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
      required:
        - code
        - message

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
